[package]
name = "oklog_ulid"
version = "0.1.0"
edition = "2021"
authors = ["ams0301"]
license = "Apache-2.0"
description = "Rust port of oklog/ulid (Go) — Universally Unique Lexicographically Sortable Identifier"
repository = "https://github.com/ams0301/oklog-ulid-rs"
documentation = "https://github.com/ams0301/oklog-ulid-rs"
readme = "README.md"
keywords = ["ulid", "id", "sortable", "identifier", "oklog"]
categories = ["no-std", "data-structures", "encoding", "parsing"]
exclude = ["/reference", "/benches/upstream-go", "/.github"]

[lib]
name = "oklog_ulid"
path = "src/lib.rs"

[[bin]]
name = "oklog-ulid"
path = "src/bin/ulid.rs"

[[bin]]
name = "diff_fuzz"
path = "fuzz/harness.rs"

[[bin]]
name = "ulid_bench"
path = "bench/ulid_bench.rs"

# Integration tests live under tests/port/ per the Port-Mortem advisory
# layout. Cargo only auto-discovers tests/*.rs, so we declare the path
# explicitly here so `cargo test` picks it up.
[[test]]
name = "integration"
path = "tests/port/integration.rs"

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
# No external dev-dependencies to keep build disk/dep footprint minimal
# (host is disk-constrained during the 72h window). Benchmarks are
# implemented as plain #[test]-style timing harnesses in benches/ulid.rs
# using std::time::Instant rather than pulling in criterion. The harness
# mirrors Go Benchmark* from reference/ulid_test.go lines 641-842.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# No `[[bench]]` table: lit.rs makes benches runnable via `cargo test --benches`
# using the default libtest harness with a manual timing wrapper.
